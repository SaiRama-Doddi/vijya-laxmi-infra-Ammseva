<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vlRedSphereFav" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#EB262B" />
      <stop offset="60%" stop-color="#C91419" />
      <stop offset="100%" stop-color="#8E080C" />
    </radialGradient>
    <clipPath id="vlWhiteRingClipFav">
      <circle cx="100" cy="100" r="62" />
    </clipPath>
    <filter id="vlBadgeDropShadowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Royal Blue Ring -->
  <circle cx="100" cy="100" r="95" fill="#0A58A2" />

  <!-- Yellow Dashed Road Marking Ring -->
  <circle
    cx="100"
    cy="100"
    r="75"
    fill="none"
    stroke="#FFE600"
    stroke-width="7.5"
    stroke-dasharray="22 17"
    stroke-linecap="butt"
  />

  <!-- Middle White Ring with Horizontal Red Stripe -->
  <g clip-path="url(#vlWhiteRingClipFav)">
    <circle cx="100" cy="100" r="62" fill="#FFFFFF" />
    <rect x="25" y="87" width="150" height="26" fill="#D91B24" />
  </g>

  <!-- Inner Red Core Sphere with Soft Depth Shadow -->
  <circle
    cx="100"
    cy="100"
    r="50"
    fill="url(#vlRedSphereFav)"
    filter="url(#vlBadgeDropShadowFav)"
  />

  <!-- White Lightning Bolt -->
  <path
    d="M 64 115 L 105 88 L 96 95 L 138 82 L 108 102 L 115 96 Z"
    fill="#FFFFFF"
  />

  <!-- Stylized Bold Golden-Yellow "VL" Letters -->
  <!-- V Letter -->
  <path
    d="M 94 69 L 107 104 L 120 69"
    stroke="#FFE600"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- L Letter -->
  <path
    d="M 120 69 L 120 104 L 142 104"
    stroke="#FFE600"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
